server_tokens off;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name qiuhai.net.cn www.qiuhai.net.cn;

    return 301 https://qiuhai.net.cn$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/qiuhai.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiuhai.net.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.qiuhai.net.cn;

    ssl_certificate /etc/letsencrypt/live/qiuhai.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiuhai.net.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://qiuhai.net.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name qiuhai.net.cn;

    ssl_certificate /etc/letsencrypt/live/qiuhai.net.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiuhai.net.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/qiuhai/current;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
